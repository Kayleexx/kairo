workflow: video
aliases: [video-processing]
description: analyze Y4M or the first 24 frames of H.264/AVC MP4 video
accepts: [y4m, mp4-h264]
resources:
  fuel: 3500000000
  memory_bytes: 33554432
mode: stream
input: sample.y4m
result:
  high: frames-analyzed
  low: average-luma

steps:
  - name: read-media-stream
    component: ../../stream/transform.wat
  - name: forward-media-stream
    component: ../../stream/transform.wat
  - name: analyze-video
    component: ../../../components/reference/video/component.wasm

edges:
  - from: read-media-stream
    to: forward-media-stream
  - from: forward-media-stream
    to: analyze-video

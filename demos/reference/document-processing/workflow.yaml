workflow: doc
aliases: [document-processing]
description: validate and aggregate structured invoice records
accepts: [jsonl, csv]
mode: stream
input: records.jsonl
result:
  high: records
  low: total-cents

steps:
  - name: read-record-stream
    component: ../../stream/transform.wat
  - name: forward-record-stream
    component: ../../stream/transform.wat
  - name: summarize-records
    component: summarize.wat

edges:
  - from: read-record-stream
    to: forward-record-stream
  - from: forward-record-stream
    to: summarize-records

workflow: doc
description: extract and summarize text from TXT or DOCX documents
accepts: [txt, docx]
resources:
  fuel: 250000000
  memory_bytes: 67108864
mode: stream
input: sample.txt

steps:
  - name: read-document-stream
    component: ../../stream/transform.wat
  - name: analyze-document
    component: ../../../components/reference/doc/component.wasm

edges:
  - from: read-document-stream
    to: analyze-document

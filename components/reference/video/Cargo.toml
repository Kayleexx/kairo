[package]
name = "kairo-video"
version = "0.1.0"
description = "analyze Y4M or the first 24 frames of H.264/AVC MP4 video"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[lib]
crate-type = ["cdylib"]

[dependencies]
oxideav-core = "0.1.35"
oxideav-mp4 = "0.0.10"
rusty_h264-decoder = { version = "0.16.0", default-features = false, features = ["std"] }
wit-bindgen = "0.61.1"

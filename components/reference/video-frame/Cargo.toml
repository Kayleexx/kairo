[package]
name = "kairo-video-frame"
version = "0.1.0"
description = "Builds a bounded grayscale H.264 contact-sheet PNG preview."
edition = "2024"
license = "MIT"
rust-version = "1.95"

[lib]
crate-type = ["cdylib"]

[dependencies]
oxideav-core = "0.1.35"
oxideav-mp4 = "0.0.10"
png = "0.17.16"
rusty_h264-decoder = { version = "0.16.0", default-features = false, features = ["std"] }
wit-bindgen = "0.61.1"

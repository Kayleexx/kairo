[package]
name = "kairo-doc"
version = "0.1.0"
description = "extract and summarize text from TXT or DOCX documents"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[lib]
crate-type = ["cdylib"]

[dependencies]
office_oxide = { version = "=0.1.10", default-features = false }
wit-bindgen = "0.61.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

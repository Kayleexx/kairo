name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: run tests
        run: cargo test --workspace --locked

      - name: run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: enforce markdown policy
        shell: bash
        run: |
          if git ls-files '*.md' | grep -v -x 'README.md'; then
            echo 'only README.md may be tracked as markdown'
            exit 1
          fi

      - name: enforce file size limit
        shell: bash
        run: |
          find Cargo.toml crates components wit .github -type f \
            \( -name '*.rs' -o -name '*.toml' -o -name '*.wit' -o -name '*.wat' -o -name '*.yml' -o -name '*.yaml' \) \
            -print0 | xargs -0 awk 'FNR == 401 { print FILENAME ": exceeds 400 lines"; failed = 1 } END { exit failed }'

      - name: show sccache stats
        if: always()
        run: sccache --show-stats

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C debuginfo=0 -C link-arg=-fuse-ld=mold
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: install mold linker
        run: sudo apt-get install --yes mold

      - name: setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-targets: true
          cache-on-failure: true
          key: cargo-${{ hashFiles('Cargo.lock') }}-mold-nodebug

      - name: install wasm-tools
        run: command -v wasm-tools || cargo install wasm-tools --locked --version 1.245.1

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: generate ephemeral MinIO credentials
        run: |
          echo "MINIO_ROOT_USER=ci-$(openssl rand -hex 6)" >> "$GITHUB_ENV"
          echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: start MinIO
        run: |
          docker run -d --name kairo-minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in {1..30}; do
            docker run --rm --network host --entrypoint /bin/sh \
              quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 \
              -c "mc alias set local http://127.0.0.1:9000 '$MINIO_ROOT_USER' '$MINIO_ROOT_PASSWORD' && mc mb --ignore-existing local/kairo" && exit 0
            sleep 1
          done
          exit 1

      - name: show MinIO logs on failure
        if: failure()
        run: docker logs kairo-minio

      - name: run tests
        env:
          KAIRO_ARTIFACT_ENDPOINT: http://127.0.0.1:9000
          KAIRO_ARTIFACT_BUCKET: kairo
          KAIRO_MINIO_ACCESS_KEY_ID: ${{ env.MINIO_ROOT_USER }}
          KAIRO_MINIO_SECRET_ACCESS_KEY: ${{ env.MINIO_ROOT_PASSWORD }}
          KAIRO_TEST_COMPONENT_TARGET_DIR: ${{ runner.temp }}/kairo-component-target
        run: cargo test --workspace --locked

      - name: run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: enforce markdown policy
        shell: bash
        run: |
          if git ls-files '*.md' | grep -v -x 'README.md'; then
            echo 'only README.md may be tracked as markdown'
            exit 1
          fi

      - name: enforce file size limit
        shell: bash
        run: |
          find Cargo.toml crates components demos wit .github -type f \
            \( -name '*.rs' -o -name '*.toml' -o -name '*.wit' -o -name '*.wat' -o -name '*.yml' -o -name '*.yaml' \) \
            -print0 | xargs -0 awk 'FNR == 401 { print FILENAME ": exceeds 400 lines"; failed = 1 } END { exit failed }'

      - name: show sccache stats
        if: always()
        run: sccache --show-stats

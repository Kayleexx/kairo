[workspace]
members = ["crates/cli", "crates/core", "crates/runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Kayleexx/kairo"
rust-version = "1.95"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
kairo-core = { path = "crates/core" }
kairo-runtime = { path = "crates/runtime" }
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
wasmtime = { version = "48.0.1", default-features = false, features = [
    "component-model-async",
    "cranelift",
    "runtime",
    "std",
    "wat",
] }

[workspace]
members = ["crates/cli", "crates/core", "crates/runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Kayleexx/kairo"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
kairo-core = { path = "crates/core" }
kairo-runtime = { path = "crates/runtime" }
serde = { version = "1.0.228", features = ["derive"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.47.1", features = ["macros", "rt"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
wasmtime = { version = "48.0.1", default-features = false, features = [
    "component-model-async",
    "cranelift",
    "runtime",
    "std",
    "wat",
] }
yaml_serde = "0.10.7"
